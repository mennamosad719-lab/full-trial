<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MedQuiz – Cardiology Study Dashboard</title>
<style>
:root{
  --bg:#eef5f8; --card:#fff; --teal:#1d7593; --teal-d:#155a72; --teal-l:#e1f0f5;
  --ink:#16313c; --muted:#5f7a86; --line:#d8e5ea;
  --ok:#1e9e5a; --ok-bg:#e3f6ec; --bad:#d64545; --bad-bg:#fde8e8; --flag:#e69a1a; --flag-bg:#fff3dc;
  --radius:14px; --shadow:0 2px 10px rgba(29,117,147,.09);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;line-height:1.45;min-height:100vh}
.wrap{max-width:1040px;margin:0 auto;padding:18px 16px 60px}
h1,h2,h3{margin:0}
button{font:inherit;cursor:pointer}
.topbar{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.logo{width:38px;height:38px;border-radius:11px;background:var(--teal);color:#fff;display:grid;place-items:center;font-weight:700;font-size:20px}
.topbar h1{font-size:20px;color:var(--teal-d)}
.topbar small{display:block;color:var(--muted);font-size:12.5px}
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);border:1px solid var(--line)}
.btn{background:var(--teal);color:#fff;border:0;border-radius:10px;padding:9px 16px;font-weight:600;transition:.15s}
.btn:hover{background:var(--teal-d)}
.btn.ghost{background:var(--teal-l);color:var(--teal-d)}
.btn.ghost:hover{background:#cfe6ee}
.btn.outline{background:#fff;color:var(--teal-d);border:1.5px solid var(--teal)}
.btn.outline:hover{background:var(--teal-l)}
.btn.small{padding:6px 12px;font-size:13.5px;border-radius:8px}
.btn:disabled{opacity:.45;cursor:not-allowed}

/* countdown */
.countdown{background:linear-gradient(135deg,#1d7593,#2a93b4);color:#fff;border-radius:var(--radius);padding:18px 20px;display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between;box-shadow:var(--shadow)}
.cd-title{font-size:13px;opacity:.85;text-transform:uppercase;letter-spacing:.06em}
.cd-name{font-size:20px;font-weight:700}
.cd-units{display:flex;gap:10px}
.cd-unit{background:rgba(255,255,255,.17);border-radius:10px;padding:8px 12px;min-width:62px;text-align:center}
.cd-unit b{display:block;font-size:22px;font-variant-numeric:tabular-nums}
.cd-unit span{font-size:11px;opacity:.85;text-transform:uppercase}
.cd-edit{background:rgba(255,255,255,.2);color:#fff;border:0;border-radius:8px;padding:6px 12px;font-size:13px}
.cd-edit:hover{background:rgba(255,255,255,.32)}
.cd-form{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.cd-form input{padding:8px 10px;border-radius:8px;border:0;font:inherit;color:var(--ink)}

/* stats */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:14px 0}
.stat{padding:14px 16px}
.stat span{display:block;font-size:12.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.stat b{font-size:27px;color:var(--teal)}
.search{width:100%;padding:13px 16px 13px 42px;border-radius:12px;border:1.5px solid var(--line);font:inherit;background:#fff url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='18' height='18' viewBox='0 0 24 24' fill='none' stroke='%231d7593' stroke-width='2.4' stroke-linecap='round'><circle cx='11' cy='11' r='7'/><path d='M21 21l-4.3-4.3'/></svg>") no-repeat 14px center}
.search:focus{outline:none;border-color:var(--teal);box-shadow:0 0 0 3px rgba(29,117,147,.15)}
.section-h{margin:22px 0 10px;font-size:15px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.subjects{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px}
.subject{padding:18px;cursor:pointer;transition:.15s;border-top:4px solid var(--teal)}
.subject:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(29,117,147,.18)}
.subject .ic{font-size:28px}
.subject h3{margin:6px 0 4px;font-size:18px}
.subject p{margin:0;color:var(--muted);font-size:14px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{background:var(--teal-l);color:var(--teal-d);border-radius:999px;padding:3px 10px;font-size:12px}
.empty{padding:30px;text-align:center;color:var(--muted)}

/* subject view */
.crumb{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0 18px}
.exam-list{display:flex;flex-direction:column;gap:10px}
.exam{display:flex;align-items:center;gap:12px;padding:14px 16px;flex-wrap:wrap}
.exam .info{flex:1;min-width:200px}
.exam .info b{display:block}
.exam .info small{color:var(--muted)}
.best{font-size:12px;background:var(--ok-bg);color:var(--ok);padding:2px 9px;border-radius:999px;font-weight:600}

/* quiz */
.qhead{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.qhead h2{font-size:17px;color:var(--teal-d)}
.timer{background:#fff;border:1.5px solid var(--teal);color:var(--teal-d);border-radius:10px;padding:6px 14px;font-weight:700;font-variant-numeric:tabular-nums;font-size:18px}
.timer.low{border-color:var(--bad);color:var(--bad);animation:pulse 1s infinite}
@keyframes pulse{50%{background:var(--bad-bg)}}
.progress{height:7px;background:#dbe9ef;border-radius:99px;overflow:hidden;margin-bottom:14px}
.progress i{display:block;height:100%;background:var(--teal);transition:.25s}
.qcard{padding:22px}
.qtop{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;gap:8px}
.qnum{color:var(--muted);font-size:13.5px;font-weight:600}
.flagbtn{background:#fff;border:1.5px solid var(--line);border-radius:8px;padding:5px 12px;color:var(--muted);font-size:13.5px}
.flagbtn.on{background:var(--flag-bg);border-color:var(--flag);color:#a86a00;font-weight:600}
.qtext{font-size:19px;font-weight:600;margin:4px 0 16px}
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:9px;color:var(--ink);transition:.12s}
.opt:hover:not(:disabled){border-color:var(--teal);background:#f6fbfd}
.opt .l{flex:none;width:26px;height:26px;border-radius:50%;background:var(--teal-l);color:var(--teal-d);display:grid;place-items:center;font-weight:700;font-size:13px}
.opt:disabled{cursor:default}
.opt.correct{background:var(--ok-bg);border-color:var(--ok)}
.opt.correct .l{background:var(--ok);color:#fff}
.opt.wrong{background:var(--bad-bg);border-color:var(--bad)}
.opt.wrong .l{background:var(--bad);color:#fff}
.fb{margin-top:6px;padding:10px 14px;border-radius:10px;font-size:14.5px}
.fb.ok{background:var(--ok-bg);color:#126b3c}
.fb.bad{background:var(--bad-bg);color:#9b2525}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:16px}
.grid-wrap{padding:16px;margin-top:14px}
.grid-wrap h4{margin:0 0 10px;font-size:13.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.qgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:7px}
.qg{height:38px;border-radius:9px;border:1.5px solid var(--line);background:#fff;font-weight:600;color:var(--ink);position:relative}
.qg.ok{background:var(--ok-bg);border-color:var(--ok);color:#126b3c}
.qg.bad{background:var(--bad-bg);border-color:var(--bad);color:#9b2525}
.qg.cur{outline:2.5px solid var(--teal);outline-offset:1px}
.qg.fl::after{content:"";position:absolute;top:-4px;right:-4px;width:12px;height:12px;border-radius:50%;background:var(--flag);border:2px solid #fff}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:12px;font-size:12.5px;color:var(--muted)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:4px;margin-right:5px;vertical-align:-1px;border:1.5px solid var(--line)}

/* results */
.result{padding:26px;text-align:center}
.ring{width:150px;height:150px;border-radius:50%;margin:8px auto 12px;display:grid;place-items:center;background:conic-gradient(var(--c) calc(var(--p)*1%), #e3edf1 0)}
.ring div{width:118px;height:118px;border-radius:50%;background:#fff;display:grid;place-items:center}
.ring b{font-size:32px;color:var(--ink)}
.rscore{font-size:20px;font-weight:700}
.rmsg{color:var(--muted);margin:4px 0 16px}
.tabs{display:flex;gap:8px;margin:20px 0 12px}
.tab{background:#fff;border:1.5px solid var(--line);border-radius:999px;padding:6px 16px;color:var(--muted)}
.tab.on{background:var(--teal);border-color:var(--teal);color:#fff}
.rev{padding:16px 18px;margin-bottom:10px}
.rev .qt{font-weight:600;margin-bottom:8px}
.rev .ln{font-size:14.5px;padding:3px 0}
.rev .ln.g{color:#126b3c}
.rev .ln.r{color:#9b2525}
.tag{display:inline-block;font-size:11.5px;border-radius:999px;padding:2px 9px;margin-left:6px;font-weight:600}
.tag.fl{background:var(--flag-bg);color:#a86a00}
.tag.sk{background:#eceff1;color:#546e7a}
@media(max-width:700px){
  .stats{grid-template-columns:repeat(2,1fr)}
  .cd-unit{min-width:54px;padding:6px 8px}
  .qtext{font-size:17px}
}
</style>
</head>

/* ===================== STORAGE ===================== */
const KEY="medquiz_v1";
function load(){try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&typeof s==="object")return Object.assign({attempts:[],countdown:{title:"Mid exam",date:""}},s)}catch(e){}return{attempts:[],countdown:{title:"Mid exam",date:""}}}
let store=load();
function save(){try{localStorage.setItem(KEY,JSON.stringify(store))}catch(e){}}

/* ===================== HELPERS ===================== */
const $=s=>document.querySelector(s);
const app=$("#app");
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const letters="ABCDEFGH";
const allExams=()=>DATA.flatMap(s=>s.exams.map(e=>Object.assign({subject:s},e)));
const findSubject=id=>DATA.find(s=>s.id===id);
const findExam=id=>allExams().find(e=>e.id===id);
let tick=null;
function clearTick(){if(tick){clearInterval(tick);tick=null}}

/* ===================== HOME ===================== */
let search="";
let editingCd=false;

function stats(){
  const exams=allExams();
  const tq=exams.reduce((n,e)=>n+e.qs.length,0);
  const at=store.attempts;
  const avg=at.length?Math.round(at.reduce((n,a)=>n+a.pct,0)/at.length):null;
  return{te:exams.length,tq,taken:at.length,avg};
}

function cdHTML(){
  const c=store.countdown;
  if(editingCd){
    return `<div class="countdown"><div class="cd-form">
      <input id="cdTitle" type="text" placeholder="Exam name" value="${esc(c.title||"")}">
      <input id="cdDate" type="datetime-local" value="${esc(c.date||"")}">
      <button class="btn small" style="background:#fff;color:#155a72" onclick="saveCd()">Save</button>
      <button class="cd-edit" onclick="editingCd=false;home()">Cancel</button></div></div>`;
  }
  return `<div class="countdown"><div><div class="cd-title">Exam countdown</div><div class="cd-name">${esc(c.title||"My exam")}</div></div>
    <div class="cd-units" id="cdUnits"></div>
    <button class="cd-edit" onclick="editingCd=true;home()">✎ Edit</button></div>`;
}
function saveCd(){
  store.countdown={title:$("#cdTitle").value.trim()||"My exam",date:$("#cdDate").value};
  save();editingCd=false;home();
}
function updateCd(){
  const el=$("#cdUnits");if(!el)return;
  const d=store.countdown.date;
  if(!d){el.innerHTML=`<div style="opacity:.9">Set your exam date with “Edit” →</div>`;return}
  let ms=new Date(d).getTime()-Date.now();
  if(isNaN(ms)){el.innerHTML="";return}
  if(ms<=0){el.innerHTML=`<div style="font-weight:700;font-size:18px">Exam time – good luck! 🍀</div>`;return}
  const s=Math.floor(ms/1000),dd=Math.floor(s/86400),h=Math.floor(s%86400/3600),m=Math.floor(s%3600/60),sec=s%60;
  const u=(v,l)=>`<div class="cd-unit"><b>${String(v).padStart(2,"0")}</b><span>${l}</span></div>`;
  el.innerHTML=u(dd,"days")+u(h,"hrs")+u(m,"min")+u(sec,"sec");
}

function home(){
  clearTick();
  const st=stats();
  app.innerHTML=`
    ${cdHTML()}
    <div class="stats">
      <div class="card stat"><span>Total Exams</span><b>${st.te}</b></div>
      <div class="card stat"><span>Total Questions</span><b>${st.tq}</b></div>
      <div class="card stat"><span>Exams Taken</span><b>${st.taken}</b></div>
      <div class="card stat"><span>Average Score</span><b>${st.avg===null?"—":st.avg+"%"}</b></div>
    </div>
    <input class="search" id="search" type="search" placeholder="Search topics and exams…" value="${esc(search)}" autocomplete="off">
    <div class="section-h">Subjects</div>
    <div id="results"></div>`;
  $("#search").addEventListener("input",e=>{search=e.target.value;renderResults()});
  renderResults();
  updateCd();tick=setInterval(updateCd,1000);
}

function renderResults(){
  const ql=search.trim().toLowerCase();
  let html="";
  DATA.forEach(s=>{
    const subjMatch=!ql||s.name.toLowerCase().includes(ql);
    const matches=ql?s.exams.filter(e=>e.title.toLowerCase().includes(ql)):[];
    if(!subjMatch&&!matches.length)return;
    const nq=s.exams.reduce((n,e)=>n+e.qs.length,0);
    html+=`<div class="card subject" onclick="openSubject('${s.id}')">
      <div class="ic">${s.icon}</div><h3>${esc(s.name)}</h3>
      <p>${s.exams.length} exam${s.exams.length>1?"s":""} · ${nq} questions</p>
      ${matches.length?`<div class="chips">${matches.map(e=>`<span class="chip">${esc(e.title)}</span>`).join("")}</div>`:""}
    </div>`;
  });
  $("#results").innerHTML=html?`<div class="subjects">${html}</div>`:`<div class="card empty">No topics or exams match “${esc(search)}”.</div>`;
  // matching exams list
  if(ql){
    const ex=allExams().filter(e=>e.title.toLowerCase().includes(ql));
    if(ex.length){
      $("#results").innerHTML+=`<div class="section-h">Matching exams</div><div class="exam-list">${ex.map(examRow).join("")}</div>`;
    }
  }
}

/* ===================== SUBJECT ===================== */
function bestOf(id){const a=store.attempts.filter(x=>x.examId===id);return a.length?Math.max(...a.map(x=>x.pct)):null}
function examRow(e){
  const b=bestOf(e.id);
  return `<div class="card exam"><div class="info"><b>${esc(e.title)}</b><small>${e.qs.length} questions${e.subject?" · "+esc(e.subject.name):""}</small></div>
    ${b!==null?`<span class="best">Best ${b}%</span>`:""}
    <button class="btn small" onclick="startExam('${e.id}',false)">Start</button>
    <button class="btn small ghost" onclick="startExam('${e.id}',true)">Shuffle</button></div>`;
}
function openSubject(id){
  clearTick();
  const s=findSubject(id);
  const all=s.exams.flatMap(e=>e.qs);
  app.innerHTML=`
    <div class="crumb"><button class="btn small outline" onclick="home()">← Home</button><h2>${s.icon} ${esc(s.name)}</h2></div>
    <div class="actions">
      <button class="btn" onclick="startRandom('${s.id}')">🎲 Random mixed quiz (10 questions)</button>
      <button class="btn ghost" onclick="startFull('${s.id}')">🔀 Full Shuffled Exam (${all.length})</button>
    </div>
    <div class="section-h">Lecture exams</div>
    <div class="exam-list">${s.exams.map(e=>examRow(Object.assign({subject:null},e))).join("")}</div>`;
  window.scrollTo(0,0);
}

/* ===================== QUIZ ===================== */
let Z=null; // current quiz

function buildItems(pool,shuf){
  const base=shuf?shuffle(pool):pool;
  return base.map(x=>{
    let idx=x.o.map((t,i)=>i);
    const keep=x.o.some(t=>/\babove\b/i.test(t));
    if(shuf&&!keep)idx=shuffle(idx);
    return{q:x.q,opts:idx.map(i=>x.o[i]),correct:idx.indexOf(x.a),sel:null,flag:false};
  });
}
function begin(spec){
  clearTick();
  const items=buildItems(spec.pool(),spec.shuffle);
  Z={spec,items,idx:0,total:items.length*60,endAt:Date.now()+items.length*60*1000,done:false};
  renderQuiz();
  tick=setInterval(timerTick,500);
  window.scrollTo(0,0);
}
function startExam(id,shuf){
  const e=findExam(id);
  begin({examId:id,title:e.title+(shuf?" (shuffled)":""),shuffle:shuf,pool:()=>e.qs});
}
function startRandom(sid){
  const s=findSubject(sid);
  begin({examId:"rand_"+sid,title:s.name+" – Random mixed quiz",shuffle:true,pool:()=>shuffle(s.exams.flatMap(e=>e.qs)).slice(0,10)});
}
function startFull(sid){
  const s=findSubject(sid);
  begin({examId:"full_"+sid,title:s.name+" – Full shuffled exam",shuffle:true,pool:()=>s.exams.flatMap(e=>e.qs)});
}
function fmt(sec){sec=Math.max(0,sec);const h=Math.floor(sec/3600),m=Math.floor(sec%3600/60),s=sec%60;return(h?h+":":"")+String(m).padStart(h?2:1,"0")+":"+String(s).padStart(2,"0")}
function remaining(){return Math.max(0,Math.ceil((Z.endAt-Date.now())/1000))}
function timerTick(){
  if(!Z||Z.done)return;
  const r=remaining();
  const t=$("#timer");
  if(t){t.textContent="⏱ "+fmt(r);t.classList.toggle("low",r<=60)}
  if(r<=0){finish(true)}
}
function renderQuiz(){
  const it=Z.items[Z.idx],n=Z.items.length;
  const answered=Z.items.filter(x=>x.sel!==null).length;
  const locked=it.sel!==null;
  app.innerHTML=`
    <div class="qhead"><h2>${esc(Z.spec.title)}</h2><div class="timer" id="timer">⏱ ${fmt(remaining())}</div></div>
    <div class="progress"><i style="width:${answered/n*100}%"></i></div>
    <div class="card qcard">
      <div class="qtop"><span class="qnum">Question ${Z.idx+1} of ${n}</span>
        <button class="flagbtn ${it.flag?"on":""}" onclick="toggleFlag()">${it.flag?"⚑ Flagged":"⚐ Flag for review"}</button></div>
      <div class="qtext">${esc(it.q)}</div>
      ${it.opts.map((o,i)=>{
        let c="";
        if(locked){if(i===it.correct)c="correct";else if(i===it.sel)c="wrong"}
        return `<button class="opt ${c}" ${locked?"disabled":""} onclick="answer(${i})"><span class="l">${letters[i]}</span><span>${esc(o)}</span></button>`}).join("")}
      ${locked?(it.sel===it.correct
        ?`<div class="fb ok">✔ Correct!</div>`
        :`<div class="fb bad">✘ Wrong. Correct answer: <b>${letters[it.correct]}. ${esc(it.opts[it.correct])}</b></div>`):""}
      <div class="nav">
        <button class="btn outline" onclick="go(${Z.idx-1})" ${Z.idx===0?"disabled":""}>← Previous</button>
        ${Z.idx===n-1?`<button class="btn" onclick="finish(false)">Finish exam</button>`:`<button class="btn" onclick="go(${Z.idx+1})">Next →</button>`}
      </div>
    </div>
    <div class="card grid-wrap"><h4>Question navigator · ${answered}/${n} answered</h4>
      <div class="qgrid">${Z.items.map((x,i)=>{
        let c="qg";
        if(x.sel!==null)c+=x.sel===x.correct?" ok":" bad";
        if(x.flag)c+=" fl";
        if(i===Z.idx)c+=" cur";
        return `<button class="${c}" onclick="go(${i})">${i+1}</button>`}).join("")}</div>
      <div class="legend"><span><i style="background:var(--ok-bg);border-color:var(--ok)"></i>Correct</span><span><i style="background:var(--bad-bg);border-color:var(--bad)"></i>Wrong</span><span><i style="background:var(--flag);border-color:var(--flag);border-radius:50%"></i>Flagged</span><span><i></i>Unanswered</span></div>
      <div style="margin-top:14px"><button class="btn small outline" onclick="quit()">Quit quiz</button></div>
    </div>`;
  timerTick();
}
function answer(i){const it=Z.items[Z.idx];if(it.sel!==null)return;it.sel=i;renderQuiz()}
function toggleFlag(){const it=Z.items[Z.idx];it.flag=!it.flag;renderQuiz()}
function go(i){if(i<0||i>=Z.items.length)return;Z.idx=i;renderQuiz();}
function quit(){if(confirm("Quit this quiz? Your progress will be lost.")){clearTick();Z=null;home()}}

/* ===================== RESULTS ===================== */
let filter="all";
function finish(auto){
  if(!Z||Z.done)return;
  const un=Z.items.filter(x=>x.sel===null).length;
  if(!auto&&un&&!confirm(un+" question"+(un>1?"s are":" is")+" unanswered. Finish anyway?"))return;
  Z.done=true;clearTick();
  const n=Z.items.length,score=Z.items.filter(x=>x.sel===x.correct).length;
  Z.score=score;Z.pct=Math.round(score/n*100);
  store.attempts.push({examId:Z.spec.examId,title:Z.spec.title,score,total:n,pct:Z.pct,ts:Date.now()});
  save();filter="all";renderResults2(auto);
}
function renderResults2(auto){
  const n=Z.items.length,p=Z.pct;
  const col=p>=75?"var(--ok)":p>=50?"var(--flag)":"var(--bad)";
  const msg=p>=90?"Outstanding! 🌟":p>=75?"Great job!":p>=50?"Good effort – review the mistakes below.":"Keep practising – you'll get there.";
  const list=Z.items.map((x,i)=>({x,i})).filter(o=>filter==="all"||o.x.sel!==o.x.correct);
  app.innerHTML=`
    <div class="card result">
      <h2>Results</h2><div class="rmsg">${esc(Z.spec.title)}${auto?" · time is up":""}</div>
      <div class="ring" style="--p:${p};--c:${col}"><div><b>${p}%</b></div></div>
      <div class="rscore">${Z.score} / ${n} correct</div>
      <div class="rmsg">${msg}</div>
      <button class="btn" onclick="retake()">↻ Retake</button>
      <button class="btn outline" onclick="Z=null;home()">Home</button>
    </div>
    <div class="tabs">
      <button class="tab ${filter==="all"?"on":""}" onclick="filter='all';renderResults2()">All (${n})</button>
      <button class="tab ${filter==="wrong"?"on":""}" onclick="filter='wrong';renderResults2()">Wrong only (${Z.items.filter(x=>x.sel!==x.correct).length})</button>
    </div>
    ${list.length?list.map(({x,i})=>{
      const ok=x.sel===x.correct;
      return `<div class="card rev"><div class="qt">${i+1}. ${esc(x.q)}
        ${x.flag?`<span class="tag fl">flagged</span>`:""}${x.sel===null?`<span class="tag sk">skipped</span>`:""}</div>
        ${x.sel!==null&&!ok?`<div class="ln r">✘ Your answer: ${letters[x.sel]}. ${esc(x.opts[x.sel])}</div>`:""}
        ${x.sel===null?`<div class="ln r">✘ Not answered</div>`:""}
        <div class="ln g">✔ Correct: ${letters[x.correct]}. ${esc(x.opts[x.correct])}</div></div>`}).join(""):`<div class="card empty">Nothing to show – no wrong answers! 🎉</div>`}`;
  window.scrollTo(0,0);
}
function retake(){begin(Z.spec)}

home();
</script>
</body>
</html>
